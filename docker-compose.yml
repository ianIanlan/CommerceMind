# CommerceMind 智能客服系统 — Docker Compose 服务编排
# 三级记忆架构：Redis（工作记忆）+ ChromaDB（情景记忆 + 用户画像）

name: commercemind

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: commercemind
      POSTGRES_USER: commercemind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commercemind_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercemind -d commercemind"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - commercemind-network

  # ── Redis 缓存（工作记忆）────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: commercemind-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-commercemind123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - commercemind-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-commercemind123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB 向量数据库（情景记忆 + 用户画像）────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: commercemind-chromadb
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - commercemind-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Prometheus 监控 ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: commercemind-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - commercemind-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── CommerceMind 主应用 ─────────────────────────────────────────────────────────
  commercemind:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        PYTHON_PACKAGE_INDEX: ${PYTHON_PACKAGE_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: commercemind-app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    environment:
      # 容器内固定值，覆盖 .env 中的本地路径
      - REDIS_URL=redis://:${REDIS_PASSWORD:-commercemind123}@redis:6379/0
      - LOCAL_DEMO_MODE=false
      # Docker 演示默认控制 LLM 调用放大；需要做改写/画像实验时可在 .env.local 开启。
      - RAG_QUERY_REWRITE_ENABLED=false
      - PROFILE_AUTO_UPDATE=false
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - EVAL_BASELINE_PATH=/app/data/eval/baseline.json
      - COMMERCEMIND_SKILLS_DIR=/app/skills
      - COMMERCE_DB_PATH=/app/data/commerce.sqlite3
      - DATABASE_URL=postgresql://commercemind:${POSTGRES_PASSWORD:-commercemind_dev}@postgres:5432/commercemind
    volumes:
      - ./data/eval:/app/data/eval:ro
      - ./skills:/app/skills:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - commercemind-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Vue 前端 + Nginx 反向代理 ───────────────────────────────────────────────
  frontend:
    build:
      context: ../CommerceMindFrontend
      dockerfile: Dockerfile
    container_name: commercemind-frontend
    ports:
      - "80:80"
    environment:
      - PYTHON_API_URL=/api/python
    depends_on:
      commercemind:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - commercemind-network
    healthcheck:
      # Alpine 中 localhost 可能优先解析为 ::1，而 Nginx 只监听 IPv4。
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ── 网络 ────────────────────────────────────────────────────────────────────
networks:
  commercemind-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── 数据卷 ──────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  chromadb-data:
  prometheus-data:
